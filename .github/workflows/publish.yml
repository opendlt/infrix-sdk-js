name: publish

# npm trusted publishing / OIDC for the FULL @infrix/* npm surface (fifth-pass
# audit G4; sixth-pass S1–S5).
#
# Every publishable package — the eight workspace packages under packages/ AND the
# three standalone packages (@infrix/client, @infrix/wallet, @infrix/sdk) — is
# published WITHOUT a long-lived npm token: the job authenticates with a
# short-lived credential minted via GitHub's OIDC (npm "trusted publishing") and
# attaches build provenance. Publishing is driven by scripts/release-npm.mjs, which
# enforces a no-write registry preflight and a publish-if-absent plan (see
# docs/release/npm-publishing.md), so a release can never start blind, never fail on
# an already-published version, and is safe to re-run.
#
# One-time setup (operator, on npmjs.com — cannot be done from here): for EACH of
# the eleven packages, Package → Settings → Trusted Publisher → GitHub Actions,
# repository `opendlt/infrix-sdk-js`, workflow `publish.yml`. Until a package is
# configured, its publish step fails closed (no token fallback, by design).
#
# `id-token: write` is mandatory for both the OIDC token exchange and provenance.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and pack only; do not publish to npm'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  # Plan-3: sign (build-provenance attest) the pack + registry-verification artifacts.
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # @infrix/prover builds its WASM from infrix-core; every build/pack/publish
      # step needs this to point at the sibling checkout below.
      INFRIX_CORE_DIR: ${{ github.workspace }}/infrix-core
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          path: infrix-sdk-js
      - name: Checkout infrix-core (sibling, for the prover assets)
        uses: actions/checkout@v4
        with:
          repository: opendlt/infrix-core
          token: ${{ secrets.INFRIX_CORE_TOKEN || github.token }}
          path: infrix-core
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Pin the publish toolchain (audit S5). 11.5.1 is the minimum npm with OIDC
      # trusted publishing and is not the npm bundled with Node 22. Pinning (not
      # @latest) keeps lifecycle/provenance/JSON semantics stable between releases.
      - name: Pin npm to a known-good trusted-publishing version
        run: |
          npm install -g npm@11.5.1
          npm --version
      - name: Install workspace packages
        working-directory: infrix-sdk-js/packages
        run: npm ci
      - name: Install standalone packages
        working-directory: infrix-sdk-js
        run: |
          for d in typescript typescript-wallet assemblyscript; do
            echo "== npm ci $d =="
            ( cd "$d" && npm ci )
          done
      # Authoritative payload gate over ALL eleven packages (audit Z4): build every
      # package's REAL published payload and validate license/pinned-deps/size/
      # declared-targets/required-files — workspace AND standalone, one enumeration.
      # Plan-3 lane 1 (npm-pack-manifest / BUILDABILITY): --manifest writes the
      # authoritative pack manifest (per-package dist.shasum/integrity) uploaded below.
      - name: Supply-chain guard + pack manifest (all 11 packages, real payloads)
        working-directory: infrix-sdk-js
        run: node scripts/supply-chain-all.mjs --manifest npm-pack-manifest.json
      # Behavioral tests before publish (audit S4) — the guard proves payload shape,
      # not behavior.
      - name: Test workspace packages
        working-directory: infrix-sdk-js/packages
        run: npm test --workspaces --if-present
      - name: Test standalone packages
        working-directory: infrix-sdk-js
        run: |
          for d in typescript typescript-wallet assemblyscript; do
            echo "== npm test $d =="
            ( cd "$d" && npm test )
          done
      # No-write registry preflight across all eleven packages (audit S1/S3): fails
      # closed on any registry error and writes the release manifest.
      - name: Release preflight (registry plan, no writes)
        working-directory: infrix-sdk-js
        run: node scripts/release-npm.mjs --preflight --manifest release-manifest.json
      # Real publish — release events, or a manual dispatch with dry_run unchecked.
      # OIDC trusted publishing (no NODE_AUTH_TOKEN); provenance via each manifest's
      # publishConfig. Only absent versions are published; a re-run resumes the rest.
      # --require-trusted-publisher-ready (audit Z5) refuses to write to the registry
      # until release/trusted-publishers.json attests every package is configured, so
      # a package lacking npm trusted-publisher setup cannot cause a partial release.
      - name: Publish to npm (trusted publishing / OIDC + provenance)
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        working-directory: infrix-sdk-js
        run: node scripts/release-npm.mjs --publish --require-trusted-publisher-ready --manifest release-manifest.json
      # Dry-run — manual dispatch with dry_run checked (the default). Builds and
      # packs every package without touching the registry.
      - name: Dry-run publish (no registry write)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: infrix-sdk-js
        run: node scripts/release-npm.mjs --dry-run --manifest release-manifest.json
      # Plan-3 lane 2 (npm-registry-published / PUBLICATION): AFTER a real publish,
      # query the LIVE npm registry and confirm every exact name@version is published,
      # comparing dist.shasum + dist.integrity against the pack manifest. Fails closed
      # unless all 11 are live + integrity-matched — this is the ONLY evidence that
      # turns the infrix-core npm-registry-published lane green.
      - name: Verify registry publication (live registry query)
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        working-directory: infrix-sdk-js
        run: node scripts/verify-npm-registry.mjs --manifest npm-pack-manifest.json --out npm-registry-verification.json
      # Sign (build-provenance attestation) the two split artifacts so a consumer can
      # cryptographically verify they were produced by THIS workflow run.
      - name: Attest pack + registry artifacts (signed)
        if: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && always() }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            infrix-sdk-js/npm-pack-manifest.json
            infrix-sdk-js/npm-registry-verification.json
      # Record the exact package set / versions / outcomes as a release artifact
      # (audit S3), even if a prior step failed.
      - name: Upload release + pack + registry-verification manifests
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-npm-lanes
          path: |
            infrix-sdk-js/release-manifest.json
            infrix-sdk-js/npm-pack-manifest.json
            infrix-sdk-js/npm-registry-verification.json
          if-no-files-found: ignore
