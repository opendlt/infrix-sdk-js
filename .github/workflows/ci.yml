name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

# A newer push cancels an in-progress run for the same ref (Actions-minute
# conservation during iterative work).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-repo goal-type parity: the committed TS + AS IntentGoalType regions
  # must match the published infrix-schema vocabulary. Fails on drift.
  sdkgen-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - run: go test ./... -count=1
        working-directory: tools/sdkgen
      # The check above compares the SDK to the schema version THIS tool pins.
      # That pin fell to v0.4.0 while the node ran v0.6.0, so the check stayed
      # green while both unions were five goals short of what the node accepts.
      # Refuse a pin that is behind the latest published schema release.
      - name: The pinned infrix-schema is the latest release
        working-directory: tools/sdkgen
        env:
          GOWORK: off
        run: |
          set -euo pipefail
          info="$(go list -m -u -json github.com/opendlt/infrix-schema)"
          echo "$info"
          if echo "$info" | grep -q '"Update"'; then
            echo "::error::tools/sdkgen pins an infrix-schema release that is not the latest; bump it (go get github.com/opendlt/infrix-schema@latest) and regenerate with go run ."
            exit 1
          fi

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: packages
      - run: npm test
        working-directory: packages

  # Source-present prover rebuild (second-pass audit D2). The `packages` job above
  # runs source-ABSENT, so @infrix/prover uses committed assets and never exercises
  # the cross-repo WASM rebuild. This job checks out infrix-core as a sibling, points
  # @infrix/prover at it via INFRIX_CORE_DIR, and runs the prover workspace test
  # WITHOUT INFRIX_PROVER_ALLOW_VENDORED — so a broken source-present rebuild fails CI.
  # The Windows leg guards the D1 failure mode (bash -> WSL cannot see Go); the
  # rebuild goes through the OS-neutral Node builder (infrix-core/scripts/build-prover-wasm.mjs).
  #
  # infrix-core is private, so the sibling checkout below uses the read-only
  # INFRIX_CORE_DEPLOY_KEY secret (same key publish.yml uses).
  prover-source-rebuild:
    strategy:
      fail-fast: false
      matrix:
        # Windows bills at 2x Actions minutes — run the Windows leg only on
        # release + manual dispatch; push/PR run ubuntu-only. The D1 guard
        # (bash->WSL can't see Go) is still covered on every release.
        os: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          path: infrix-sdk-js
      - name: Checkout infrix-core (sibling, for the prover source)
        uses: actions/checkout@v4
        with:
          repository: opendlt/infrix-core
          # infrix-core is private; the SDK repo's github.token can't read it. Use
          # the same read-only DEPLOY KEY publish.yml uses (secret INFRIX_CORE_DEPLOY_KEY;
          # public half on infrix-core → Settings → Deploy keys). ssh-key → SSH checkout.
          ssh-key: ${{ secrets.INFRIX_CORE_DEPLOY_KEY }}
          path: infrix-core
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspaces
        working-directory: infrix-sdk-js/packages
        run: npm ci
      - name: Rebuild @infrix/prover from source (fail-closed, no vendored fallback)
        working-directory: infrix-sdk-js/packages
        env:
          INFRIX_CORE_DIR: ${{ github.workspace }}/infrix-core
        run: npm test --workspace @infrix/prover

  # @infrix/client (typescript/) had NO CI lane at all: `packages` covers only the
  # packages/ workspace, and typescript/ is standalone. Its 174 tests gated nothing,
  # which is how its vendored-fixture drift fence sat SKIPPED from the moment the
  # SDK was extracted out of infrix-core without anyone seeing it.
  #
  # Both modes are run on purpose, for the same reason prover-source-rebuild runs
  # source-present separately:
  #   * source-ABSENT  — what a consumer of the published package gets. The parity
  #                      fence legitimately skips; everything else must still pass.
  #   * source-PRESENT — infrix-nexus-web and infrix-crates (both public) checked out
  #                      as siblings, so the fixture byte-identity fence and the
  #                      contract result-code fence both execute. The step FAILS if
  #                      anything skips, because a skip here is the exact condition
  #                      that hid the broken resolver.
  client-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          path: infrix-sdk-js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install @infrix/client
        working-directory: infrix-sdk-js/typescript
        run: npm ci
      - name: Test source-ABSENT (published-consumer mode)
        working-directory: infrix-sdk-js/typescript
        run: npm test
      - name: Checkout infrix-nexus-web (sibling, the parity-fixture source of truth)
        uses: actions/checkout@v4
        with:
          repository: opendlt/infrix-nexus-web
          path: infrix-nexus-web
      - name: Checkout infrix-crates (sibling, the source of the contract result-code registry)
        uses: actions/checkout@v4
        with:
          repository: opendlt/infrix-crates
          path: infrix-crates
      - name: Test source-PRESENT (the parity and result-code fences must run, not skip)
        working-directory: infrix-sdk-js/typescript
        run: |
          set -o pipefail
          npm test 2>&1 | tee client-suite.log
          if ! grep -qE '^.* skipped 0$' client-suite.log; then
            echo "::error::the client suite skipped a test with the fixture source present -- a skipped drift fence reads as coverage"
            grep -E 'skipped' client-suite.log || true
            exit 1
          fi

  # Supply-chain guard (third-pass audit T2). Validates the REAL published tarball
  # of every workspace package (license, pinned deps, non-empty payload, size
  # budget, and required generated files such as the @infrix/prover WASM assets).
  # It needs infrix-core so @infrix/prover can build its assets — a package that
  # would publish without them is a supply-chain finding, not a skip. Uses the
  # same INFRIX_CORE_DEPLOY_KEY sibling checkout as prover-source-rebuild.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          path: infrix-sdk-js
      - name: Checkout infrix-core (sibling, for the prover assets)
        uses: actions/checkout@v4
        with:
          repository: opendlt/infrix-core
          # Same read-only DEPLOY KEY as prover-source-rebuild / publish.yml
          # (secret INFRIX_CORE_DEPLOY_KEY); github.token can't read private infrix-core.
          ssh-key: ${{ secrets.INFRIX_CORE_DEPLOY_KEY }}
          path: infrix-core
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspaces
        working-directory: infrix-sdk-js/packages
        run: npm ci
      # The 3 STANDALONE packages (typescript→@infrix/client, typescript-wallet→
      # @infrix/wallet, assemblyscript→@infrix/sdk) are NOT in the packages/ workspace,
      # so supply-chain-all.mjs (which packs ALL 11) needs their deps installed first —
      # their prepack builds tsc/asc from these node_modules. Mirrors publish.yml.
      - name: Install standalone packages
        working-directory: infrix-sdk-js
        run: |
          for d in typescript typescript-wallet assemblyscript; do
            echo "== npm ci $d =="
            ( cd "$d" && npm ci )
          done
      - name: Supply-chain check (all workspace packages)
        working-directory: infrix-sdk-js/packages
        env:
          INFRIX_CORE_DIR: ${{ github.workspace }}/infrix-core
        run: npm run check:supply-chain
      # Pass-23 audit P2-3: the AUTHORITATIVE full-surface guard over ALL 11
      # publishable packages (workspace + standalone), producing the fresh npm-pack
      # payload manifest that is archived as the verified supply-chain artifact.
      - name: Supply-chain check (all 11 packages) + write manifest
        working-directory: infrix-sdk-js
        env:
          INFRIX_CORE_DIR: ${{ github.workspace }}/infrix-core
        run: node scripts/supply-chain-all.mjs --manifest supply-chain-manifest.json
      - name: Archive supply-chain manifest (all 11 packages)
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-manifest
          path: infrix-sdk-js/supply-chain-manifest.json
          if-no-files-found: error
